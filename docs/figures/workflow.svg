<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><rect width="1120" height="830" fill="#fff"/><text x="40" y="54" font-size="28" font-weight="700" fill="#1b1b19" text-anchor="start">The workflow: you do the thinking, it questions and checks.</text><text x="40" y="86" font-size="16" font-weight="400" fill="#5d5d58" text-anchor="start">Each stage ends at a gate. Open questions go to the ledger and come back each session until answered.</text><text x="40" y="138" font-size="14" font-weight="600" fill="#8a8a83" text-anchor="start">Stage</text><text x="214" y="138" font-size="14" font-weight="600" fill="#8a8a83" text-anchor="start">You</text><text x="506" y="138" font-size="14" font-weight="600" fill="#8a8a83" text-anchor="start">Commands and checks</text><text x="796" y="138" font-size="14" font-weight="600" fill="#8a8a83" text-anchor="start">Gate before the next stage</text><line x1="40" y1="150" x2="1080" y2="150" stroke="#c9c9c2" stroke-width="1"/><text x="40" y="200" font-size="26" font-weight="700" fill="#2f6fde" text-anchor="start">1</text><text x="74" y="200" font-size="19" font-weight="700" fill="#1b1b19" text-anchor="start">Question</text><text x="214" y="200" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="start">State your claim and what would refute it</text><rect x="496" y="180" width="270" height="30" rx="6" fill="#efefeb"/><text x="506" y="200" font-size="13" font-weight="600" fill="#1b1b19" text-anchor="start">/er-plan  /er-question</text><text x="796" y="200" font-size="14" font-weight="400" fill="#1b1b19" text-anchor="start">A question you chose, a rival named</text><line x1="40" y1="242" x2="1080" y2="242" stroke="#e6e6e1" stroke-width="1"/><text x="40" y="292" font-size="26" font-weight="700" fill="#2f6fde" text-anchor="start">2</text><text x="74" y="292" font-size="19" font-weight="700" fill="#1b1b19" text-anchor="start">Sources</text><text x="214" y="292" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="start">Search, then read what you will cite</text><rect x="496" y="272" width="270" height="30" rx="6" fill="#efefeb"/><text x="506" y="292" font-size="13" font-weight="600" fill="#1b1b19" text-anchor="start">--find  /er-citation-check</text><text x="796" y="292" font-size="14" font-weight="400" fill="#1b1b19" text-anchor="start">Every source on record, and read</text><line x1="40" y1="334" x2="1080" y2="334" stroke="#e6e6e1" stroke-width="1"/><text x="40" y="384" font-size="26" font-weight="700" fill="#2f6fde" text-anchor="start">3</text><text x="74" y="384" font-size="19" font-weight="700" fill="#1b1b19" text-anchor="start">Analysis</text><text x="214" y="384" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="start">Run your plan; test it against rivals</text><rect x="496" y="364" width="270" height="30" rx="6" fill="#efefeb"/><text x="506" y="384" font-size="13" font-weight="600" fill="#1b1b19" text-anchor="start">/er-challenge  /er-stats</text><text x="796" y="384" font-size="14" font-weight="400" fill="#1b1b19" text-anchor="start">Every reported statistic adds up</text><line x1="40" y1="426" x2="1080" y2="426" stroke="#e6e6e1" stroke-width="1"/><text x="40" y="476" font-size="26" font-weight="700" fill="#2f6fde" text-anchor="start">4</text><text x="74" y="476" font-size="19" font-weight="700" fill="#1b1b19" text-anchor="start">Writing</text><text x="214" y="476" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="start">You write; it critiques and edits</text><rect x="496" y="456" width="270" height="30" rx="6" fill="#efefeb"/><text x="506" y="476" font-size="13" font-weight="600" fill="#1b1b19" text-anchor="start">/er-review  /er-claims</text><text x="796" y="476" font-size="14" font-weight="400" fill="#1b1b19" text-anchor="start">No claim stronger than its evidence</text><line x1="40" y1="518" x2="1080" y2="518" stroke="#e6e6e1" stroke-width="1"/><text x="40" y="568" font-size="26" font-weight="700" fill="#2f6fde" text-anchor="start">5</text><text x="74" y="568" font-size="19" font-weight="700" fill="#1b1b19" text-anchor="start">Submission</text><text x="214" y="568" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="start">Check everything; say what AI did</text><rect x="496" y="548" width="270" height="30" rx="6" fill="#efefeb"/><text x="506" y="568" font-size="13" font-weight="600" fill="#1b1b19" text-anchor="start">all three checks  /er-disclosure</text><text x="796" y="568" font-size="14" font-weight="400" fill="#1b1b19" text-anchor="start">Clean scan, truthful statement</text><line x1="40" y1="610" x2="1080" y2="610" stroke="#e6e6e1" stroke-width="1"/><text x="40" y="660" font-size="26" font-weight="700" fill="#2f6fde" text-anchor="start">6</text><text x="74" y="660" font-size="19" font-weight="700" fill="#1b1b19" text-anchor="start">Review</text><text x="214" y="660" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="start">Reviewing, or answering reviewers</text><rect x="496" y="640" width="270" height="30" rx="6" fill="#efefeb"/><text x="506" y="660" font-size="13" font-weight="600" fill="#1b1b19" text-anchor="start">/er-peer-review  /er-rebuttal</text><text x="796" y="660" font-size="14" font-weight="400" fill="#1b1b19" text-anchor="start">Your judgement, your response</text><line x1="40" y1="702" x2="1080" y2="702" stroke="#e6e6e1" stroke-width="1"/><text x="40" y="746" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="start">Throughout: your view first, evidence labelled, references and statistics checked in code, a position held under pressure</text><text x="40" y="770" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="start">and changed for evidence. Never handed over: writing the work, inventing a source, hiding that AI was used.</text></svg>
