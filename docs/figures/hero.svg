<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><rect width="1120" height="600" fill="#fff"/><text x="40" y="140" font-size="17" font-weight="600" fill="#1b1b19" text-anchor="start">Biomedical papers with a fabricated citation</text><text x="40" y="162" font-size="14" font-weight="400" fill="#8a8a83" text-anchor="start">per 10,000 papers</text><rect x="70" y="443.55374823196604" width="92" height="26.446251768033942" rx="4" fill="#b2b2aa"/><text x="116" y="411.55374823196604" font-size="22" font-weight="700" fill="#1b1b19" text-anchor="middle">3.5</text><text x="116" y="431.55374823196604" font-size="13" font-weight="400" fill="#5d5d58" text-anchor="middle">1 in 2,828</text><text x="116" y="494" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="middle">2023</text><rect x="200" y="306.70305676855895" width="92" height="163.29694323144105" rx="4" fill="#b2b2aa"/><text x="246" y="274.70305676855895" font-size="22" font-weight="700" fill="#1b1b19" text-anchor="middle">21.8</text><text x="246" y="294.70305676855895" font-size="13" font-weight="400" fill="#5d5d58" text-anchor="middle">1 in 458</text><text x="246" y="494" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="middle">2025</text><rect x="330" y="200.0" width="92" height="270.0" rx="4" fill="#1b1b19"/><text x="376" y="168.0" font-size="22" font-weight="700" fill="#1b1b19" text-anchor="middle">36.1</text><text x="376" y="188.0" font-size="13" font-weight="400" fill="#5d5d58" text-anchor="middle">1 in 277</text><text x="376" y="494" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="middle">early 2026</text><line x1="56" y1="470" x2="450" y2="470" stroke="#c9c9c2" stroke-width="1"/><text x="40" y="534" font-size="13" font-weight="400" fill="#8a8a83" text-anchor="start">Topaz et al., The Lancet, 2026: about 2.5 million papers.</text><line x1="510" y1="130" x2="510" y2="560" stroke="#e6e6e1" stroke-width="1"/><text x="40" y="54" font-size="25" font-weight="700" fill="#1b1b19" text-anchor="start">Fabricated citations are rising. Checked and questioned, AI does far better.</text><text x="40" y="86" font-size="16" font-weight="400" fill="#5d5d58" text-anchor="start">Left: what reaches the published record. Right: the same models with and without this skill, and its checks on known answers.</text><text x="540" y="140" font-size="17" font-weight="600" fill="#1b1b19" text-anchor="start">Integrity failures across 5 models from three vendors</text><text x="540" y="162" font-size="14" font-weight="400" fill="#8a8a83" text-anchor="start">18 cases, 3 runs each</text><text x="540" y="210" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="start">Bare model</text><rect x="690" y="196" width="300" height="20" rx="10" fill="#efefeb"/><rect x="690" y="196" width="300.0" height="20" rx="10" fill="#b2b2aa"/><text x="1006" y="212" font-size="17" font-weight="700" fill="#1b1b19" text-anchor="start">63 in 270</text><text x="540" y="264" font-size="15" font-weight="600" fill="#1b1b19" text-anchor="start">With the skill</text><rect x="690" y="250" width="300" height="20" rx="10" fill="#efefeb"/><rect x="690" y="250" width="28.571428571428573" height="20" rx="10" fill="#2f6fde"/><text x="1006" y="266" font-size="17" font-weight="700" fill="#1b1b19" text-anchor="start">6 in 270</text><text x="540" y="338" font-size="17" font-weight="600" fill="#1b1b19" text-anchor="start">The checks, on test sets with known answers</text><text x="540" y="386" font-size="15" font-weight="400" fill="#1b1b19" text-anchor="start">Fabricated or retracted references flagged</text><text x="1080" y="386" font-size="13" font-weight="400" fill="#8a8a83" text-anchor="end">0/54 real ones flagged</text><rect x="540" y="396" width="450" height="14" rx="7" fill="#efefeb"/><rect x="540" y="396" width="450.0" height="14" rx="7" fill="#2f6fde"/><text x="1006" y="408" font-size="17" font-weight="700" fill="#1b1b19" text-anchor="start">83/83</text><text x="540" y="448" font-size="15" font-weight="400" fill="#1b1b19" text-anchor="start">Detectable statistical errors flagged</text><text x="1080" y="448" font-size="13" font-weight="400" fill="#8a8a83" text-anchor="end">0/200 correct results flagged</text><rect x="540" y="458" width="450" height="14" rx="7" fill="#efefeb"/><rect x="540" y="458" width="450.0" height="14" rx="7" fill="#2f6fde"/><text x="1006" y="470" font-size="17" font-weight="700" fill="#1b1b19" text-anchor="start">171/171</text><text x="540" y="510" font-size="15" font-weight="400" fill="#1b1b19" text-anchor="start">Hidden prompts and slop found in files</text><text x="1080" y="510" font-size="13" font-weight="400" fill="#8a8a83" text-anchor="end">0/20 clean files flagged</text><rect x="540" y="520" width="450" height="14" rx="7" fill="#efefeb"/><rect x="540" y="520" width="450.0" height="14" rx="7" fill="#2f6fde"/><text x="1006" y="532" font-size="17" font-weight="700" fill="#1b1b19" text-anchor="start">40/40</text></svg>
