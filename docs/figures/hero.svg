<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><rect width="1120" height="600" fill="#fff"/><text x="40" y="140" font-size="17" font-weight="600" fill="#1b1b19" text-anchor="start">Biomedical papers with a fabricated citation</text><text x="40" y="162" font-size="14" font-weight="400" fill="#8a8a83" text-anchor="start">per 10,000 papers</text><rect x="70" y="443.55374823196604" width="92" height="26.446251768033942" rx="4" fill="#b2b2aa"/><text x="116" y="411.55374823196604" font-size="22" font-weight="700" fill="#1b1b19" text-anchor="middle">3.5</text><text x="116" y="431.55374823196604" font-size="13" font-weight="400" fill="#5d5d58" text-anchor="middle">1 in 2,828</text><text x="116" y="494" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="middle">2023</text><rect x="200" y="306.70305676855895" width="92" height="163.29694323144105" rx="4" fill="#b2b2aa"/><text x="246" y="274.70305676855895" font-size="22" font-weight="700" fill="#1b1b19" text-anchor="middle">21.8</text><text x="246" y="294.70305676855895" font-size="13" font-weight="400" fill="#5d5d58" text-anchor="middle">1 in 458</text><text x="246" y="494" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="middle">2025</text><rect x="330" y="200.0" width="92" height="270.0" rx="4" fill="#1b1b19"/><text x="376" y="168.0" font-size="22" font-weight="700" fill="#1b1b19" text-anchor="middle">36.1</text><text x="376" y="188.0" font-size="13" font-weight="400" fill="#5d5d58" text-anchor="middle">1 in 277</text><text x="376" y="494" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="middle">early 2026</text><line x1="56" y1="470" x2="450" y2="470" stroke="#c9c9c2" stroke-width="1"/><text x="40" y="534" font-size="13" font-weight="400" fill="#8a8a83" text-anchor="start">Topaz et al., The Lancet, 2026: about 2.5 million papers.</text><line x1="510" y1="130" x2="510" y2="560" stroke="#e6e6e1" stroke-width="1"/><text x="40" y="54" font-size="25" font-weight="700" fill="#1b1b19" text-anchor="start">Fabricated citations are rising. Checked and questioned, AI does far better.</text><text x="40" y="86" font-size="16" font-weight="400" fill="#5d5d58" text-anchor="start">Left: the published record. Right: five models with this skill, rival skills or none, and its reference checker.</text><text x="540" y="140" font-size="17" font-weight="600" fill="#1b1b19" text-anchor="start">Integrity failures across 5 models from three vendors</text><text x="540" y="162" font-size="14" font-weight="400" fill="#8a8a83" text-anchor="start">21 cases, 3 runs each, about 300 runs per arm</text><text x="540" y="200" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="start">Bare model</text><rect x="690" y="186" width="300" height="18" rx="9" fill="#efefeb"/><rect x="690" y="186" width="300.0" height="18" rx="9" fill="#b2b2aa"/><text x="1006" y="201" font-size="17" font-weight="400" fill="#1b1b19" text-anchor="start">66</text><text x="540" y="234" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="start">K-Dense 2.72.0</text><rect x="690" y="220" width="300" height="18" rx="9" fill="#efefeb"/><rect x="690" y="220" width="186.36363636363637" height="18" rx="9" fill="#8a8a83"/><text x="1006" y="235" font-size="17" font-weight="400" fill="#1b1b19" text-anchor="start">41</text><text x="540" y="268" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="start">ARS 3.24.0</text><rect x="690" y="254" width="300" height="18" rx="9" fill="#efefeb"/><rect x="690" y="254" width="81.81818181818181" height="18" rx="9" fill="#5d5d58"/><text x="1006" y="269" font-size="17" font-weight="400" fill="#1b1b19" text-anchor="start">18</text><text x="540" y="302" font-size="15" font-weight="600" fill="#1b1b19" text-anchor="start">This skill</text><rect x="690" y="288" width="300" height="18" rx="9" fill="#efefeb"/><rect x="690" y="288" width="0.0" height="18" rx="9" fill="#2f6fde"/><text x="1006" y="303" font-size="17" font-weight="700" fill="#1b1b19" text-anchor="start">0</text><text x="540" y="356" font-size="17" font-weight="600" fill="#1b1b19" text-anchor="start">Its reference checker, on benchmarks built by others</text><text x="540" y="398" font-size="15" font-weight="400" fill="#1b1b19" text-anchor="start">HALLMARK, MCC, beside the best tool without a model</text><rect x="690" y="408" width="300" height="14" rx="7" fill="#efefeb"/><rect x="690" y="408" width="232.74" height="14" rx="7" fill="#2f6fde"/><text x="540" y="420" font-size="13" font-weight="600" fill="#1b1b19" text-anchor="start">This checker</text><text x="1006" y="420" font-size="15" font-weight="700" fill="#1b1b19" text-anchor="start">0.776</text><rect x="690" y="428" width="300" height="14" rx="7" fill="#efefeb"/><rect x="690" y="428" width="223.2052512899997" height="14" rx="7" fill="#b2b2aa"/><text x="540" y="440" font-size="13" font-weight="400" fill="#5d5d58" text-anchor="start">bibtex-updater</text><text x="1006" y="440" font-size="15" font-weight="400" fill="#1b1b19" text-anchor="start">0.744</text><text x="540" y="482" font-size="15" font-weight="400" fill="#1b1b19" text-anchor="start">Real reference lists, MCC, beside the best of five tools</text><rect x="690" y="492" width="300" height="14" rx="7" fill="#efefeb"/><rect x="690" y="492" width="172.79999999999998" height="14" rx="7" fill="#2f6fde"/><text x="540" y="504" font-size="13" font-weight="600" fill="#1b1b19" text-anchor="start">This checker</text><text x="1006" y="504" font-size="15" font-weight="700" fill="#1b1b19" text-anchor="start">0.576</text><rect x="690" y="512" width="300" height="14" rx="7" fill="#efefeb"/><rect x="690" y="512" width="142.5" height="14" rx="7" fill="#b2b2aa"/><text x="540" y="524" font-size="13" font-weight="400" fill="#5d5d58" text-anchor="start">RefChecker</text><text x="1006" y="524" font-size="15" font-weight="400" fill="#1b1b19" text-anchor="start">0.475</text></svg>
