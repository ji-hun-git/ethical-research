<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><rect width="1280" height="640" fill="#fff"/><text x="96" y="250" font-size="76" font-weight="700" fill="#1b1b19" text-anchor="start">Ethical Research</text><text x="96" y="320" font-size="34" font-weight="400" fill="#5d5d58" text-anchor="start">A research assistant that keeps questioning.</text><line x1="96" y1="372" x2="420" y2="372" stroke="#2f6fde" stroke-width="4"/><text x="96" y="430" font-size="26" font-weight="400" fill="#5d5d58" text-anchor="start">Checks references, statistics and hidden prompts in code.</text><text x="96" y="472" font-size="26" font-weight="400" fill="#5d5d58" text-anchor="start">Changes its mind for evidence, not pressure. Never writes the work for you.</text><text x="96" y="560" font-size="22" font-weight="500" fill="#8a8a83" text-anchor="start">github.com/ji-hun-git/ethical-research</text></svg>
